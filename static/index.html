<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS Action List</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --text: #e6e6e6;
    --muted: #8b8fa3;
    --accent: #4f8cff;
    --done: #3d4a3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1rem;
    max-width: 680px;
    margin: 0 auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
  }
  h1 { margin: 0; font-size: 1.4rem; font-weight: 500; }
  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .filter-btn, button {
    background: var(--card);
    border: 1px solid #2a2e3a;
    color: var(--text);
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .task-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .task {
    background: var(--card);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    border: 1px solid #222632;
    transition: opacity 0.15s;
  }
  .task.completed { opacity: 0.55; }
  .task.completed .title { text-decoration: line-through; color: var(--muted); }
  .checkbox {
    width: 20px; height: 20px;
    margin-top: 2px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .content { flex: 1; }
  .title { font-size: 1rem; line-height: 1.35; }
  .meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .cat { 
    padding: 0.1rem 0.45rem; 
    border-radius: 4px; 
    background: #2a3040; 
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .cat.Insurance { background: #2a3a5a; color: #8eb4ff; }
  .cat.Fibre { background: #3a2a4a; color: #d4a8ff; }
  .cat.Pool { background: #2a4a3a; color: #8effb0; }
  .cat.Admin { background: #4a3a2a; color: #ffd08e; }
  .add-form {
    margin-top: 1.5rem;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  input, select {
    background: var(--card);
    border: 1px solid #2a2e3a;
    color: var(--text);
    padding: 0.55rem 0.7rem;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  input { flex: 1; min-width: 180px; }
  button.primary {
    background: var(--accent);
    color: white;
    border: none;
  }
  .empty { text-align: center; color: var(--muted); padding: 2rem 0; }
</style>
</head>
<body>
<header>
  <h1>Action List</h1>
  <span style="font-size:0.8rem;color:var(--muted)">JARVIS</span>
</header>

<div class="filters" id="filters">
  <button class="filter-btn active" data-cat="">All</button>
  <button class="filter-btn" data-cat="Insurance">Insurance</button>
  <button class="filter-btn" data-cat="Fibre">Fibre</button>
  <button class="filter-btn" data-cat="Pool Care">Pool Care</button>
  <button class="filter-btn" data-cat="Admin">Admin</button>
</div>

<div class="task-list" id="list"></div>

<form class="add-form" id="addForm">
  <input type="text" id="newTitle" placeholder="New action…" required>
  <select id="newCat">
    <option>Insurance</option>
    <option>Fibre</option>
    <option>Pool Care</option>
    <option>Admin</option>
    <option>General</option>
  </select>
  <button type="submit" class="primary">Add</button>
</form>

<script>
const listEl = document.getElementById('list');
const filters = document.getElementById('filters');
let currentFilter = '';

async function load() {
  const res = await fetch('/api/tasks' + (currentFilter ? `?category=${encodeURIComponent(currentFilter)}` : ''));
  const tasks = await res.json();
  render(tasks);
}

function render(tasks) {
  if (!tasks.length) {
    listEl.innerHTML = '<div class="empty">No actions pending, Sir.</div>';
    return;
  }
  listEl.innerHTML = tasks.map(t => `
    <div class="task ${t.completed ? 'completed' : ''}" data-id="${t.id}">
      <input type="checkbox" class="checkbox" ${t.completed ? 'checked' : ''} onchange="toggle(${t.id}, this.checked)">
      <div class="content">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="meta">
          <span class="cat ${t.category.replace(' ', '')}">${escapeHtml(t.category)}</span>
          <span>${new Date(t.created_at).toLocaleDateString()}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[m]));
}

async function toggle(id, completed) {
  await fetch(`/api/tasks/${id}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({completed})
  });
  load();
}

filters.addEventListener('click', e => {
  if (e.target.classList.contains('filter-btn')) {
    filters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.cat;
    load();
  }
});

document.getElementById('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const title = document.getElementById('newTitle').value.trim();
  const category = document.getElementById('newCat').value;
  if (!title) return;
  await fetch('/api/tasks', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title, category})
  });
  document.getElementById('newTitle').value = '';
  load();
});

load();
</script>
</body>
</html>
